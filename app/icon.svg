<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1053"/>
      <stop offset="50%" stop-color="#120A3E"/>
      <stop offset="100%" stop-color="#080421"/>
    </linearGradient>

    <!-- Metallic Silver / Chrome Loop Gradient -->
    <linearGradient id="metallicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="50%" stop-color="#F5D17A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="#312579" stroke-width="4"/>

  <!-- Subtle Border Highlight -->
  <rect x="22" y="22" width="468" height="468" rx="114" fill="none" stroke="url(#cyanGrad)" stroke-opacity="0.3" stroke-width="2.5"/>

  <!-- Center Medical Cross Outline Container -->
  <rect x="216" y="100" width="80" height="312" rx="28" fill="none" stroke="url(#metallicGrad)" stroke-width="16"/>
  <rect x="100" y="216" width="312" height="80" rx="28" fill="none" stroke="url(#metallicGrad)" stroke-width="16"/>

  <!-- Infinity Sync Loop (Intertwining Loops) -->
  <path d="M 256 256 
           C 190 170, 120 170, 120 256 
           C 120 342, 190 342, 256 256 
           C 322 170, 392 170, 392 256 
           C 392 342, 322 342, 256 256 Z" 
        fill="none" stroke="url(#metallicGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Inner Heartbeat Pulse (Gold) -->
  <path d="M 124 256 H 155 L 168 220 L 182 290 L 198 238 L 210 256 H 240" 
        fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)"/>

  <!-- Right Inner Heartbeat Pulse (Cyan) -->
  <path d="M 272 256 H 302 L 315 220 L 329 290 L 345 238 L 357 256 H 388" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)"/>

  <!-- Top Vertical Heartbeat Pulse (Gold & Cyan) -->
  <path d="M 256 124 V 155 L 238 168 L 274 182 L 230 198 L 256 210 V 230" 
        fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)"/>

  <!-- AI Sync Data Pixels (Top Right Burst) -->
  <rect x="364" y="100" width="22" height="22" rx="4" fill="#00F2FE"/>
  <rect x="394" y="116" width="18" height="18" rx="4" fill="#F5D17A"/>
  <rect x="372" y="132" width="16" height="16" rx="3" fill="#38BDF8"/>
  <rect x="420" y="100" width="18" height="18" rx="4" fill="#E2E8F0"/>
  <rect x="402" y="78" width="20" height="20" rx="4" fill="#00F2FE"/>
</svg>
